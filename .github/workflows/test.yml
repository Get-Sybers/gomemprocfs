name: Test

# The MemProcFS integration tests: the native library plus a real memory dump
# fetched from Google Cloud Storage with the identity the repository's
# variables and secrets name (upstream's infrastructure). The jobs run only
# where that is configured (GCS_MEMDUMP_PATH set); elsewhere they are skipped,
# not failed. `CI` (ci.yml) is the gate: the library-free tests, the lint and
# the structure run there on every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Matrix
    runs-on: ubuntu-24.04
    if: vars.GCS_MEMDUMP_PATH != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      memprocfs-versions: ${{ steps.get-versions.outputs.versions }}
      dump-cache-key: ${{ steps.set-dump-key.outputs.key }}
    steps:
      - name: Fetch the latest MemProcFS versions
        id: get-versions
        run: |
          # the last 3 non-draft, non-prerelease tags
          VERSIONS=$(curl -sfL https://api.github.com/repos/ufrisk/MemProcFS/releases | jq -c '[.[] | select(.prerelease==false and .draft==false) | .tag_name] | .[0:3]')
          echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"

      - name: Generate the dump cache key
        id: set-dump-key
        env:
          GCS_MEMDUMP_PATH: ${{ vars.GCS_MEMDUMP_PATH }}
        run: |
          # a key from the dump path: a new path breaks the cache
          HASH=$(echo -n "$GCS_MEMDUMP_PATH" | sha256sum | awk '{print $1}')
          echo "key=memdump-zst-$HASH" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.memprocfs-version }})
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # the Google Cloud workload-identity exchange
    strategy:
      fail-fast: false
      matrix:
        memprocfs-version: ${{ fromJSON(needs.prepare.outputs.memprocfs-versions) }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Cache the compressed memory dump
        id: cache-dump
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dumps/memdump.raw.zst
          key: ${{ needs.prepare.outputs.dump-cache-key }}

      - name: Authenticate to Google Cloud
        if: steps.cache-dump.outputs.cache-hit != 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.cache-dump.outputs.cache-hit != 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Download the memory dump (if not cached)
        if: steps.cache-dump.outputs.cache-hit != 'true'
        env:
          GCS_MEMDUMP_PATH: ${{ vars.GCS_MEMDUMP_PATH }}
        run: |
          mkdir -p dumps
          gcloud storage cp "$GCS_MEMDUMP_PATH" dumps/memdump.raw.zst

      - name: Decompress the memory dump
        run: zstd -d dumps/memdump.raw.zst -o dumps/memdump.raw

      - name: Cache MemProcFS
        id: cache-vmm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: memprocfs
          key: memprocfs-ubuntu-24.04-${{ matrix.memprocfs-version }}

      - name: Download MemProcFS
        if: steps.cache-vmm.outputs.cache-hit != 'true'
        env:
          MEMPROCFS_VERSION: ${{ matrix.memprocfs-version }}
        run: |
          mkdir -p memprocfs
          PATTERN="linux_x64"
          # the asset list of the exact version; the version comes in through the environment
          ASSETS=$(curl -sfL "https://api.github.com/repos/ufrisk/MemProcFS/releases/tags/$MEMPROCFS_VERSION")
          DOWNLOAD_URL=$(echo "$ASSETS" | jq -r ".assets[] | select(.name | test(\"$PATTERN\")) | .browser_download_url" | head -1)
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::no asset matching $PATTERN in release $MEMPROCFS_VERSION"
            exit 1
          fi
          curl -sfL "$DOWNLOAD_URL" -o memprocfs/release.tar.gz
          tar -xzf memprocfs/release.tar.gz -C memprocfs
          rm -f memprocfs/release.tar.gz

      - name: Locate the native library
        id: vmm-path
        run: |
          VMM_LIB=$(find memprocfs -name "vmm.so" -o -name "libvmm.so" | head -1)
          if [ -z "$VMM_LIB" ]; then
            echo "::error::no native library in the MemProcFS release"
            find memprocfs -type f | head -20
            exit 1
          fi
          VMM_LIB=${VMM_LIB#./}
          DIR_NAME=$(dirname "$VMM_LIB")
          echo "path=$GITHUB_WORKSPACE/$VMM_LIB" >> "$GITHUB_OUTPUT"
          echo "dir=$GITHUB_WORKSPACE/$DIR_NAME" >> "$GITHUB_OUTPUT"

      - name: Run the tests against the dump
        env:
          VMM_DLL_PATH: ${{ steps.vmm-path.outputs.path }}
          MEMDUMP_PATH: ${{ github.workspace }}/dumps/memdump.raw
          LD_LIBRARY_PATH: ${{ steps.vmm-path.outputs.dir }}
        run: go test -count=1 -shuffle=on ./...
